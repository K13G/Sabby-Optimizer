name: Sabby Optimizer Release
on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sabby-release
  cancel-in-progress: true
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Read Sabby version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/SabbyOptimizer/SabbyOptimizer.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read Sabby version." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $downloadBase = "https://github.com/${{ github.repository }}/releases/download/v$version"
          & "src/Release/Build-Release.ps1" -RequireInstaller -DownloadBaseUrl $downloadBase
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sabby Optimizer ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            src/artifacts/installer/SabbyOptimizer-${{ steps.version.outputs.version }}-Setup.exe
      - name: Remove superseded releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $currentTag = "v$version"
          # Keep 0.23.30 as the rollback/reference release. Future releases may supersede
          # other old builds, but this known-good baseline is intentionally never deleted.
          $keepTags = @($currentTag, "v0.23.30")
          $oldTags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          foreach ($tag in $oldTags) {
            $tag = $tag.Trim()
            if ($tag -and $keepTags -notcontains $tag) {
              Write-Host "Removing superseded release $tag"
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Could not remove superseded release $tag" }
            }
          }
      - name: Publish stable update manifest
        shell: pwsh
        run: |
          New-Item "update" -ItemType Directory -Force | Out-Null
          Copy-Item "src/artifacts/packages/SabbyOptimizer-Stable-manifest.json" "update/SabbyOptimizer-Stable-manifest.json" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "update/SabbyOptimizer-Stable-manifest.json"
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Sabby ${{ steps.version.outputs.version }} stable manifest"
            # main may have received docs-only commits while the Windows build was running.
            # Rebase the generated manifest commit before pushing.
            git pull --rebase origin main
            $pushed = $false
            for ($attempt = 1; $attempt -le 4 -and -not $pushed; $attempt++) {
              git push
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }
              if ($attempt -lt 4) {
                Write-Warning "GitHub rejected the manifest push on attempt $attempt. Retrying..."
                Start-Sleep -Seconds 8
                git pull --rebase origin main
              }
            }
            if (-not $pushed) { throw "Could not publish the stable manifest after 4 attempts." }
          }
